<title id="title">Anna's iterative design process</title><desc id="desc">Understand informs a connected iterative loop of Design, Build and Improve, with feedback returning to earlier stages.</desc>
<rect width="1200" height="480" fill="#F5F1E9"/>
<g font-family="'Instrument Sans','Inter',Arial,sans-serif" fill="#17283B">
<text x="54" y="55" font-size="15" letter-spacing="3">FIELD NOTE / 02</text>
<text x="54" y="104" font-size="39" font-weight="600" letter-spacing="-1.6">A process, not a pipeline.</text>
<text x="55" y="142" font-size="18" fill="#697981">Research sets direction. Making reveals friction. Feedback reshapes the work.</text>
</g>
