<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d"><title id="t">Anna's iterative design process</title><desc id="d">Understand leads into a collaborative cycle of Design, Build and Improve.</desc><rect width="1200" height="250" rx="18" fill="#121729"/><g font-family="Arial,Helvetica,sans-serif"><text x="39" y="42" fill="#a8a7c6" font-size="17">PROCESS / NOT A STRAIGHT LINE</text>
