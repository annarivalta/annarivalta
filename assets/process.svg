<rect x="659" y="76" width="235" height="104" rx="17" fill="#1c344c" stroke="#7bbdf1" stroke-width="2"/><text x="777" y="115" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">03 / BUILD</text><text x="777" y="143" font-size="15" text-anchor="middle" fill="#d3eafa">Implement · integrate</text>
