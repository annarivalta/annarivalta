
name: Generate Snake Animation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3.2.0
        with:
          github_user_name: annarivalta
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23B65226&color_dots=%23FCF6ED,%23E7D8E6,%23C5A7D7,%238A65B2,%23513471
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23D9917C&color_dots=%230D1117,%2327253A,%2349346E,%238060B1,%23C29BEA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
